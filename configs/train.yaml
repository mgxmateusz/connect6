# =============================================================================
# KONFIGURACJA TRENINGU CONNECT6 - CZYSTE MLP
# =============================================================================

run:
  name: "connect6_mlp_01"
  root_dir: "runs"
  seed: 42

  # auto = wznów z runs/<name>/checkpoints/latest.pt, jeśli istnieje
  # none = rozpocznij od zera
  # można też podać bezpośrednią ścieżkę do konkretnego pliku .pt
  resume: "auto"

game:
  board_size: 19
  win_length: 6
  debug_checks: false

model:
  architecture_version: 3

  # Dla planszy 19x19 wejście ma 724 wartości:
  #   361 = moje kamienie
  #   361 = kamienie przeciwnika
  #     1 = stones_left / 2
  #     1 = is_black
  layers:
    - neurons: 1024
      norm: layer
      activation: silu
      dropout: 0.0

    - neurons: 1024
      norm: none
      activation: silu
      dropout: 0.0

    - neurons: 1024
      norm: layer
      activation: silu
      dropout: 0.0

    - neurons: 768
      norm: layer
      activation: silu
      dropout: 0.0

    - neurons: 512
      norm: none
      activation: silu
      dropout: 0.0

  policy_layers: []

  value_layers:
    - neurons: 64
      norm: none
      activation: silu
      dropout: 0.0

  compile: false
  compile_mode: "default"  # default | reduce-overhead | max-autotune

training:
  device: "cuda"

  # Liczba plansz rozgrywanych równolegle.
  num_envs: 16384

  # Ta wartość oznacza liczbę minibatchy terminalnych pozycji na update.
  # Faktyczny cel pozycji = completed_positions_per_update * minibatch_size.
  completed_positions_per_update: 512

  # Maksymalny numer update'u. Update'y są numerowane od 1.
  updates: 100000

  # --------------------------------------------------------------------------
  # PPO / CREDIT ASSIGNMENT
  # --------------------------------------------------------------------------
  ppo_epochs: 2
  minibatch_size: 8192
  learning_rate: 0.0003
  lr_schedule: "cosine"     # constant | cosine
  weight_decay: 0.0001
  adam_eps: 0.00001
  clip_coef: 0.2
  value_coef: 0.50
  entropy_coef: 0.0125
  max_grad_norm: 1.0
  target_kl: 0.03
  normalize_advantage: true

  # Terminalny wynik jest cofany o gamma za każdy kamień/akcję pomiędzy
  # zapisaną decyzją a końcem partii. Ostatni ruch ma mnożnik 1.0.
  gamma: 0.995

  symmetry_augmentation: false

  # --------------------------------------------------------------------------
  # HISTORYCZNY SELF-PLAY / ANTI-FORGETTING
  # --------------------------------------------------------------------------
  # Jaka część stołów gra current-vs-history. 0.125 = dokładnie 1/8.
  historical_fraction: 0.125

  # Ile losowych checkpointów historycznych próbujemy trzymać równocześnie
  # w VRAM podczas jednego update'u. Jeśli dostępnych jest mniej, bierzemy tyle,
  # ile istnieje. Nowy zestaw jest losowany przed każdym update'em PPO.
  historical_models_per_update: 16

  # Historyczny model jest tylko przeciwnikiem. Jego ruchy NIGDY nie trafiają
  # do bufora PPO. Current gra w historycznych partiach losowo czarnymi/białymi.

  # --------------------------------------------------------------------------
  # EKSPLORACJA PODCZAS SELF-PLAY
  # --------------------------------------------------------------------------
  temperature_start: 1.00
  temperature_end: 1.00
  temperature_decay_updates: 5000

  amp: true
  amp_dtype: "bfloat16"     # bfloat16 | float16

  # Przy numeracji od 1 checkpoint_every_updates: 10 zapisuje 10,20,30,...
  checkpoint_every_updates: 10
  dashboard_every_updates: 5
