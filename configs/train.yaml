# =============================================================================
# KONFIGURACJA TRENINGU CONNECT6 - CNN V5
# =============================================================================

run:
  name: "connect6_cnn_02"
  root_dir: "runs"
  seed: 42

  # auto = wznów z runs/<name>/checkpoints/latest.pt, jeśli istnieje
  # none = rozpocznij od zera
  # można też podać bezpośrednią ścieżkę do konkretnego pliku .pt
  resume: "auto"

game:
  board_size: 19
  win_length: 6
  debug_checks: false

model:
  architecture_version: 5

  # Backbone zachowuje 19x19 przez cały model (stride=1, same padding).
  # Każdy blok: Conv -> GroupNorm (8 kanałów/grupę) -> SiLU.
  # Receptive field: 23 -> 25 -> 27 -> 29 -> 31 -> 33 -> 35 -> 37.
  kernels: [23, 3, 3, 3, 3, 3, 3, 3]
  channels: [32, 32, 64, 64, 64, 96, 96, 96]

  # Wejście [B,4,19,19]: moje, przeciwnika, maska planszy, ostatni kamień tury.
  # POLICY: Conv 1x1, 96 -> 1 -> 361 logitów.
  # VALUE:  Conv 1x1, 96 -> 1 -> global mean -> tanh.

  compile: false
  compile_mode: "default"  # default | reduce-overhead | max-autotune

training:
  device: "cuda"

  # Liczba plansz rozgrywanych równolegle.
  num_envs: 2048

  # Target pełnych pozycji na update = num_envs * completed_positions_per_update.
  # 384 zachowuje ~ten sam docelowy rozmiar PPO co wcześniejsze 768*minibatch(1024),
  # ale parametr nie zależy już od wielkości minibatcha.
  completed_positions_per_update: 384

  # Maksymalny numer update'u. Update'y są numerowane od 1.
  updates: 10000000

  # --------------------------------------------------------------------------
  # PPO / CREDIT ASSIGNMENT
  # --------------------------------------------------------------------------
  ppo_epochs: 3
  minibatch_size: 1024

  learning_rate: 0.0002
  lr_schedule: "cosine"     # constant | cosine
  weight_decay: 0.0001
  adam_eps: 0.00001
  clip_coef: 0.2
  value_coef: 0.50
  entropy_coef: 0.0125
  max_grad_norm: 2.0

  target_kl: 0.05
  kl_window: 32
  kl_hard_multiplier: 3
  normalize_advantage: true
  gamma: 0.98

  # D4 nadal ma sens dla zwykłego CNN: konwolucja daje ekwiwariancję na
  # przesunięcia, ale nie gwarantuje ekwiwariancji na obrót i odbicie.
  symmetry_augmentation: true

  # Losowe otwarcie zostaje jako eksploracja i wymuszanie różnorodności pozycji.
  # Ruch jest wykluczony z PPO, więc model nie uczy się z wymuszonej decyzji.
  random_black_opening_fraction: 0.50

  # --------------------------------------------------------------------------
  # PRZECIWNICY PODCZAS COLLECTU
  # --------------------------------------------------------------------------
  # 50% stołów: current vs current
  # 25% stołów: current vs historical
  # 25% stołów: current vs GPU tactical bot
  historical_fraction: 0.25
  bot_fraction: 0.25
  bot_v1_fraction: 0.50

  # Historyczne checkpointy są losowane niezależnie z powtórzeniami:
  # 50% z całej historii, 25% z ostatniej połowy, 25% z ostatniej ćwiartki.
  historical_models_per_update: 128
  historical_ram_cache_models: 1024

  # --------------------------------------------------------------------------
  # GPU-NATIVE ROLLOUT
  # --------------------------------------------------------------------------
  # Collector pakuje current+history do FP16 WMMA i wykonuje cały move loop
  # wewnątrz CUDA Graph conditional while. Python wraca dopiero po gotowym buforze.
  native_compile_verbose: false

  # --------------------------------------------------------------------------
  # CUDA MEMORY CACHE
  # --------------------------------------------------------------------------
  # run_train.py czyści cache dopiero po osiągnięciu 10 GB reserved VRAM.
  cuda_cache_clear_every_percent: 0.0

  # --------------------------------------------------------------------------
  # EKSPLORACJA PODCZAS SELF-PLAY
  # --------------------------------------------------------------------------
  temperature_start: 1.00
  temperature_end: 1.00
  temperature_decay_updates: 5000

  # FP16 odpowiada precyzji natywnego collectora, dzięki czemu old_logprob z
  # rolloutu i pierwszy forward PPO nie różnią się tylko przez BF16 vs FP16.
  amp: true
  amp_dtype: "float16"       # float16 | bfloat16

  checkpoint_every_updates: 1
  dashboard_every_updates: 1
