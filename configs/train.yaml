# =============================================================================
# KONFIGURACJA TRENINGU CONNECT6 - CZYSTE MLP
# =============================================================================

run:
  name: "connect6_mlp_01"
  root_dir: "runs"
  seed: 42

  # auto = wznów z runs/<name>/checkpoints/latest.pt, jeśli istnieje
  # none = rozpocznij od zera
  # można też podać bezpośrednią ścieżkę do konkretnego pliku .pt
  resume: "auto"

game:
  board_size: 19
  win_length: 6
  debug_checks: false

model:
  architecture_version: 3

  # Dla planszy 19x19 wejście ma 724 wartości:
  #   361 = moje kamienie
  #   361 = kamienie przeciwnika
  #     1 = stones_left / 2
  #     1 = is_black
  layers:
    - neurons: 1024
      norm: layer
      activation: silu
      dropout: 0.0

    - neurons: 1024
      norm: layer
      activation: silu
      dropout: 0.0

    - neurons: 1024
      norm: layer
      activation: silu
      dropout: 0.0

    - neurons: 768
      norm: layer
      activation: silu
      dropout: 0.0

    - neurons: 512
      norm: layer
      activation: silu
      dropout: 0.0

  policy_layers: []

  value_layers:
    - neurons: 64
      norm: none
      activation: silu
      dropout: 0.0

  compile: false
  compile_mode: "default"  # default | reduce-overhead | max-autotune

training:
  device: "cuda"

  # Liczba plansz rozgrywanych równolegle.
  num_envs: 16384

  # Faktyczny cel PPO = completed_positions_per_update * minibatch_size.
  # 512 * 8192 = 4 194 304 terminalnych pozycji current-policy / update.
  completed_positions_per_update: 512

  # Maksymalny numer update'u. Update'y są numerowane od 1.
  updates: 10000000

  # --------------------------------------------------------------------------
  # PPO / CREDIT ASSIGNMENT
  # --------------------------------------------------------------------------
  ppo_epochs: 2

  # Duży minibatch lepiej wykorzystuje GPU i zmniejsza szum pojedynczego KL.
  minibatch_size: 8192

  learning_rate: 0.0003
  lr_schedule: "cosine"     # constant | cosine
  weight_decay: 0.0001
  adam_eps: 0.00001
  clip_coef: 0.2
  value_coef: 0.50
  entropy_coef: 0.0125
  max_grad_norm: 1.0

  # target_kl jest SOFT limitem średniej kroczącej, a nie limitem jednego
  # przypadkowego minibatcha. Hard-stop chroni przed prawdziwym odjazdem.
  # Minibatch powodujący stop NIE wykonuje optimizer.step().
  target_kl: 0.03
  kl_window: 32
  kl_hard_multiplier: 2.0   # hard limit = 0.06 przy target_kl=0.03

  normalize_advantage: true

  # Terminalny wynik jest cofany o gamma za każdy kamień/akcję pomiędzy
  # zapisaną decyzją a końcem partii. Ostatni ruch ma mnożnik 1.0.
  gamma: 0.995

  symmetry_augmentation: false

  # --------------------------------------------------------------------------
  # HISTORYCZNY SELF-PLAY / ANTI-FORGETTING
  # --------------------------------------------------------------------------
  # Nadal sterujemy PROCENTEM wszystkich stołów. 0.125 = dokładnie 1/8.
  historical_fraction: 0.25

  # Osobno wybieramy ile różnych checkpointów losować na update.
  # Po wylosowaniu historyczne stoły są rozdzielane między modele możliwie równo
  # i dane przypisanie stół -> model pozostaje stałe do końca update'u.
  # Przy 16384 env i 12.5% history: 2048 stołów / 32 modele = 64 stoły/model.
  historical_models_per_update: 64

  # Ograniczony LRU cache w zwykłym RAM. Dla obecnego MLP 256 pełnych state_dict
  # to około 4-5 GB RAM. Po zapełnieniu najdawniej używane modele są wyrzucane.
  historical_ram_cache_models: 256

  # Zamrożeni przeciwnicy nie potrzebują FP32. To dotyczy WYŁĄCZNIE inference
  # historycznych modeli; uczony current model i jego LayerNormy nie są zmieniane.
  historical_inference_dtype: "bfloat16"   # bfloat16 | float16 | float32

  # Wszystkie historyczne modele są liczone jednym grouped batched MLP na GPU.
  # Nie ma pętli małych forwardów model-po-modelu. History ensemble liczy tylko
  # policy, bez niepotrzebnego value head. Ruchy historii NIGDY nie trafiają do PPO.

  # --------------------------------------------------------------------------
  # CUDA MEMORY CACHE
  # --------------------------------------------------------------------------
  # PyTorch trzyma zwolnione bloki VRAM w caching allocatorze. To jest dobre dla
  # szybkości, ale Menedżer zadań/NVIDIA może pokazywać dużo więcej VRAM niż żywe
  # tensory. Raz na 1% całego treningu bezpiecznie oddajemy WYŁĄCZNIE wolny cache
  # do sterownika. Wartość 0 wyłącza okresowe czyszczenie.
  cuda_cache_clear_every_percent: 1.0

  # --------------------------------------------------------------------------
  # EKSPLORACJA PODCZAS SELF-PLAY
  # --------------------------------------------------------------------------
  temperature_start: 1.00
  temperature_end: 1.00
  temperature_decay_updates: 5000

  amp: true
  amp_dtype: "bfloat16"     # bfloat16 | float16

  # W aktualnych testach zapis/dashboard są celowo wykonywane co każdy update.
  checkpoint_every_updates: 1
  dashboard_every_updates: 1
