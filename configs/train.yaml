# =============================================================================
# KONFIGURACJA TRENINGU CONNECT6 - CNN V6 DENSE
# =============================================================================

run:
  name: "connect6_cnn_05"
  root_dir: "runs"
  seed: 42
  resume: "auto"

game:
  board_size: 19
  win_length: 6
  debug_checks: false

model:
  architecture_version: 6

  # Dense backbone 19x19. GroupNorm tylko po warstwach 0, 2, 5 i 7.
  kernels: [23, 3, 3, 3, 3, 3, 3, 3]
  channels: [32, 32, 64, 64, 64, 96, 96, 96]

  compile: false
  compile_mode: "default"

training:
  device: "cuda"
  num_envs: 1024
  completed_positions_per_update: 378
  updates: 10000000

  ppo_epochs: 2
  minibatch_size: 1024

  learning_rate: 0.00015
  lr_schedule: "cosine"
  weight_decay: 0.0001
  adam_eps: 0.00001
  clip_coef: 0.2
  value_coef: 0.50
  entropy_coef: 0.0125
  max_grad_norm: 3.0

  target_kl: 0.05
  kl_window: 32
  kl_hard_multiplier: 3
  # KL/clipfrac nadal liczone dla każdego minibatcha na GPU, ale CPU odbiera je
  # pakietami zamiast wymuszać synchronizację po każdym minibatchu.
  kl_sync_interval: 32
  normalize_advantage: true
  gamma: 0.98

  symmetry_augmentation: true
  random_black_opening_fraction: 0.50

  historical_fraction: 0.25
  bot_fraction: 0.25
  bot_v1_fraction: 0.50
  historical_models_per_update: 128
  historical_ram_cache_models: 1024

  native_compile_verbose: false
  cuda_cache_clear_every_percent: 0.0

  temperature_start: 1.00
  temperature_end: 1.00
  temperature_decay_updates: 5000

  amp: true
  amp_dtype: "bfloat16"

  checkpoint_every_updates: 1
  dashboard_every_updates: 1
