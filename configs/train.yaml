# =============================================================================
# KONFIGURACJA TRENINGU CONNECT6 - CNN V6
# =============================================================================

run:
  name: "connect6_cnn_03"
  root_dir: "runs"
  seed: 42
  resume: "auto"

game:
  board_size: 19
  win_length: 6
  debug_checks: false

model:
  architecture_version: 6

  # Backbone 19x19. GroupNorm tylko po warstwach 0, 2, 5 i 7,
  # zamiast po wszystkich ośmiu convach. Aktywne GN nadal mają 8 kanałów/grupę.
  kernels: [23, 3, 3, 3, 3, 3, 3, 3]
  channels: [32, 32, 64, 64, 64, 96, 96, 96]

  # Wejście [B,4,19,19]: moje, przeciwnika, maska planszy, ostatni kamień tury.
  # POLICY: Conv 1x1, 96 -> 1 -> 361 logitów.
  # VALUE:  Conv 1x1, 96 -> 1 -> global mean -> tanh.
  compile: false
  compile_mode: "default"

training:
  device: "cuda"
  num_envs: 2048

  # Target pełnych pozycji na update = num_envs * completed_positions_per_update.
  completed_positions_per_update: 384
  updates: 10000000

  ppo_epochs: 3
  minibatch_size: 1024

  learning_rate: 0.0002
  lr_schedule: "cosine"
  weight_decay: 0.0001
  adam_eps: 0.00001
  clip_coef: 0.2
  value_coef: 0.50
  entropy_coef: 0.0125
  max_grad_norm: 2.0

  target_kl: 0.05
  kl_window: 32
  kl_hard_multiplier: 3
  normalize_advantage: true
  gamma: 0.98

  symmetry_augmentation: true
  random_black_opening_fraction: 0.50

  # 50% current/self-play, 25% history, 25% GPU tactical bot.
  historical_fraction: 0.25
  bot_fraction: 0.25
  bot_v1_fraction: 0.50
  historical_models_per_update: 128
  historical_ram_cache_models: 1024

  native_compile_verbose: false
  cuda_cache_clear_every_percent: 0.0

  temperature_start: 1.00
  temperature_end: 1.00
  temperature_decay_updates: 5000

  # BF16: duży zakres wykładnika, brak GradScalera i dobra ścieżka tensor-core.
  amp: true
  amp_dtype: "bfloat16"

  checkpoint_every_updates: 1
  dashboard_every_updates: 1
