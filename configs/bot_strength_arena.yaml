bot_strength_arena:
  checkpoint_dir: "runs/connect6_cnn_05/checkpoints"
  output_dir: "runs/connect6_cnn_05/bot_strength_arena_with_full_pair"
  device: "cuda"

  # V3 = TOP16 -> 120 own pairs, no reply.
  # Small = TOP12 -> 66 own pairs, no reply. Pure width-control experiment.
  # V4 = TOP12 -> 66 own pairs -> TOP4 own pairs -> opponent V2 TOP6 cells
  #      -> all C(6,2)=15 full two-stone opponent reply pairs.
  # Full = exhaustive reference: every legal unordered own pair C(E,2),
  #        using the same pair-state evaluator as V3/Small.
  # Every bot below is treated identically by the arena:
  # 1) every CNN checkpoint vs every bot,
  # 2) full bot-vs-bot round robin,
  # 3) every bot vs Cloudict D2/D3/D4.
  bots: ["v1", "v2", "v3", "small", "v4", "full"]

  models_per_batch: 512
  native_load_chunk_models: 32
  sync_interval_moves: 16

  bot_vs_bot:
    opening_size: 19

  cloudict:
    executable: "C:\\PRACA\\ConnectMore\\engines\\cloudict.exe"
    depths: [2, 3, 4]
    opening_sizes:
      2: 3
      3: 3
      4: 3
    vcf: false
    timeout_seconds: 60.0
    # <= 0 = unlimited retries, but only for known recoverable crash/timeout errors.
    max_restarts: 0
