bot_strength_arena:
  checkpoint_dir: "runs/connect6_cnn_05/checkpoints"
  output_dir: "runs/connect6_cnn_05/bot_strength_arena_pairfirst_liveroad_even"
  device: "cuda"

  # CNN gauntlet is filtered by tools/run_bot_strength_arena.py to even updates
  # only: model_update_2, 4, 6, ... . Existing results are resumed in-place.
  # V2 Pro = same one-cell architecture as V2, with latent-fork/road-leverage
  #          scoring for clean 2->3 and 3->4 structures before immediate threats.
  # V2 Pro2 = V2 Pro plus local partner-aware pair-force scoring for X+Y
  #           transitions 2->4 / 3->5 / 4->6 on shared six-cell roads.
  # Pair128/Pair32 = every legal pair gets the same cheap pair-aware score;
  #                  only exact finalist budget changes: 128 vs 32.
  # Hybrid128/Hybrid32 = same pure LiveRoad pool and same cheap pair-aware score;
  #                      only exact finalist budget changes: 128 vs 32.
  # Hybrid96/Hybrid64 are no longer active participants; historical rows remain.
  bots: ["v1", "v2", "v2pro", "v2pro2", "v3", "v4", "pair", "pair32", "hybrid", "hybrid32", "live", "full"]

  models_per_batch: 512
  native_load_chunk_models: 32
  sync_interval_moves: 16

  bot_vs_bot:
    opening_size: 19

  cloudict:
    executable: "C:\\PRACA\\ConnectMore\\engines\\cloudict.exe"
    depths: [2, 3, 4]
    opening_sizes:
      2: 3
      3: 3
      4: 1
    vcf: false
    timeout_seconds: 60.0
    max_restarts: 0
