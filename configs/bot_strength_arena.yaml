bot_strength_arena:
  checkpoint_dir: "runs/connect6_cnn_05/checkpoints"
  output_dir: "runs/connect6_cnn_05/bot_strength_arena_v3_pair_state"
  device: "cuda"

  # V3 = narrower pair-state + full opponent turn.
  # V4 = TOP16 current-position cells -> all 120 own pairs, no opponent reply.
  bots: ["v1", "v2", "v3", "v4"]

  # Etap 1 FAST: checkpointy są pakowane raz do natywnego layoutu FP16/WMMA.
  models_per_batch: 512
  native_load_chunk_models: 32
  sync_interval_moves: 16

  # Etap 2: wszystkie 361 wymuszonych pierwszych pól x 2 kolory.
  bot_vs_bot:
    opening_size: 19

  # Etap 3: każdy bot osobno przeciw Cloudictowi na D2, D3 i D4.
  cloudict:
    executable: "C:\\PRACA\\ConnectMore\\engines\\cloudict.exe"
    depths: [2, 3, 4]
    opening_sizes:
      2: 19
      3: 9
      4: 5
    vcf: false
    timeout_seconds: 60.0
    max_restarts: 20
