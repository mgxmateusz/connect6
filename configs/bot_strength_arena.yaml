bot_strength_arena:
  checkpoint_dir: "runs/connect6_cnn_05/checkpoints"
  output_dir: "runs/connect6_cnn_05/bot_strength_arena_pairfirst_liveroad_even"
  device: "cuda"

  # CNN gauntlet is filtered by tools/run_bot_strength_arena.py to even updates
  # only: model_update_2, 4, 6, ... . Existing baseline results are resumed in-place.
  #
  # V2Pro is the validated one-cell latent-fork/road-leverage scorer.
  # Every "*pro" search bot below keeps the corresponding baseline search depth,
  # exact evaluator, candidate budget and (where applicable) structural pool.
  # Only the V2 ordering/prior is replaced by V2Pro:
  # - V3Pro: V2Pro TOP16 cells.
  # - V4Pro: V2Pro own TOP12 and opponent TOP6 reply cells.
  # - PairPro: same all-legal-pair cheap scorer + V2Pro endpoint prior, same K.
  # - HybridPro: same pure LiveRoad pool + same cheap scorer + endpoint prior, same K.
  # - LivePro: same LiveRoad brute pool; V2Pro sparse TOP16 floor/tie ordering.
  # - FullPro: same exhaustive pair search; V2Pro only tie/single-stone ordering.
  #
  # V2Pro2 is no longer active. Its historical CSV/source can remain for comparison.
  bots: [
    "v1", "v2", "v2pro",
    "v3", "v3pro",
    "v4", "v4pro",
    "pair", "pairpro",
    "pair32", "pair32pro",
    "hybrid", "hybridpro",
    "hybrid32", "hybrid32pro",
    "live", "livepro",
    "full", "fullpro"
  ]

  models_per_batch: 512
  native_load_chunk_models: 32
  sync_interval_moves: 16

  bot_vs_bot:
    opening_size: 19

  cloudict:
    executable: "C:\\PRACA\\ConnectMore\\engines\\cloudict.exe"
    depths: [2, 3, 4]
    opening_sizes:
      2: 3
      3: 3
      4: 1
    vcf: false
    timeout_seconds: 60.0
    max_restarts: 0
