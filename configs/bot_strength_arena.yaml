bot_strength_arena:
  checkpoint_dir: "runs/connect6_cnn_05/checkpoints"
  output_dir: "runs/connect6_cnn_05/bot_strength_arena_pairfirst_liveroad_even"
  device: "cuda"

  # CNN gauntlet is filtered by tools/run_bot_strength_arena.py to even updates
  # only: model_update_2, 4, 6, ... . Existing results are resumed in-place.
  #
  # Validated active set after the V2Pro scorer A/B experiment:
  # - keep V1, V2 and V2Pro;
  # - replace baseline V3/V4 with V3Pro/V4Pro;
  # - keep original Pair/Hybrid/Live/Full families;
  # - remove failed PairPro/Pair32Pro/HybridPro/Hybrid32Pro/LivePro/FullPro twins.
  bots: [
    "v1", "v2", "v2pro",
    "v3pro", "v4pro",
    "pair", "pair32",
    "hybrid", "hybrid32",
    "live", "full"
  ]

  models_per_batch: 512
  native_load_chunk_models: 32
  sync_interval_moves: 16

  bot_vs_bot:
    opening_size: 19

  cloudict:
    executable: "C:\\PRACA\\ConnectMore\\engines\\cloudict.exe"
    depths: [2, 3, 4]
    opening_sizes:
      2: 3
      3: 3
      4: 1
    vcf: false
    timeout_seconds: 60.0
    max_restarts: 0
