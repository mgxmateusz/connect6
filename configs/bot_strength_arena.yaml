bot_strength_arena:
  checkpoint_dir: "runs/connect6_cnn_05/checkpoints"
  output_dir: "runs/connect6_cnn_05/bot_strength_arena_small_top12_v4_replypair6"
  device: "cuda"

  # V3 = TOP16 -> 120 own pairs, no reply.
  # Small = TOP12 -> 66 own pairs, no reply. Pure width-control experiment.
  # V4 = TOP12 -> 66 own pairs -> TOP4 own pairs -> opponent V2 TOP6 cells
  #      -> all C(6,2)=15 full two-stone opponent reply pairs.
  # Full Pair Brute Force is benchmark-only and is injected by
  # tools/run_bot_strength_arena.py only into the V3-vs-FULL reference match.
  bots: ["v1", "v2", "v3", "small", "v4"]

  models_per_batch: 512
  native_load_chunk_models: 32
  sync_interval_moves: 16

  bot_vs_bot:
    opening_size: 19

  cloudict:
    executable: "C:\\PRACA\\ConnectMore\\engines\\cloudict.exe"
    depths: [2, 3, 4]
    opening_sizes:
      2: 3
      3: 3
      4: 3
    vcf: false
    timeout_seconds: 60.0
    # <= 0 = unlimited retries, but only for known recoverable crash/timeout errors.
    max_restarts: 0
