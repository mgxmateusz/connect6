bot_strength_arena:
  checkpoint_dir: "runs/connect6_cnn_05/checkpoints"
  output_dir: "runs/connect6_cnn_05/bot_strength_arena"
  device: "cuda"

  # Pełna drabinka aktualnych botów.
  bots: ["v1", "v2", "v3", "v4", "v5"]

  # Etap 1: każdy autosave CNN gra z każdym botem dwa razy
  # (model raz czarny, raz biały), dokładnie jak w bot arena/championship.
  models_per_batch: 256
  inference_dtype: "bfloat16"
  sync_interval_moves: 16

  # Etap 2: każdy bot z każdym. Wszystkie 361 możliwych pierwszych pól,
  # a dla każdego pola oba przypisania kolorów = 722 gry na parę botów.
  bot_vs_bot:
    opening_size: 19

  # Etap 3: każdy bot osobno przeciw Cloudictowi na D2, D3 i D4.
  # Rozmiary otwarć są takie jak w istniejącej drabince Cloudicta:
  # D2 pełne 19x19, D3 środkowe 9x9, D4 środkowe 5x5.
  cloudict:
    executable: "C:\\PRACA\\ConnectMore\\engines\\cloudict.exe"
    depths: [2, 3, 4]
    opening_sizes:
      2: 19
      3: 9
      4: 5
    vcf: false
    timeout_seconds: 60.0
    max_restarts: 20
