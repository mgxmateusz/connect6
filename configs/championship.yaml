# =============================================================================
# KING OF CONNECT6 — TRUE PARALLEL AI CHAMPIONSHIP — CNN
# =============================================================================

championship:

  checkpoint_dir: "runs/connect6_cnn_01/checkpoints"
  output_dir: "runs/connect6_cnn_01/championship"

  # Wartość awaryjna. Przy adaptive_tables.enabled=true liczba stołów jest
  # dobierana automatycznie po krótkim benchmarku GPU.
  tables: 128

  games_per_pair: 2
  temperature: 0.0
  device: "cuda"
  amp: true
  amp_dtype: "bfloat16"

  cpu_cache_models: 16384

  # Adaptacyjny backend sam kontroluje presję VRAM. Nie opróżniamy cache CUDA
  # po każdym challengerze, bo to obniża throughput.
  empty_cache_after_unload: false

  seed: 12345

  adaptive_tables:
    enabled: true

    # Twardy limit pamięci lokalnej GPU. Po jego przekroczeniu najpierw
    # wykonywany jest empty_cache(); jeśli to nie wystarczy, rozmiar stołów
    # zostaje oznaczony jako unsafe i turniej wznawia się z niższym poziomem.
    vram_limit_gb: 11.0

    # Zakres i kandydaci krótkiego autotestu na starcie.
    min_tables: 16
    max_tables: 2048
    candidates: [16, 32, 64, 128, 256, 512, 1024, 2048]

    # Krótki benchmark inference. Wyniki są zapisywane do
    # runs/connect6_cnn_01/championship/adaptive_tables.json.
    benchmark_warmup: 1
    benchmark_iterations: 3

    # Kontrola VRAM nie synchronizuje GPU przy każdym forwardzie.
    vram_check_every_forwards: 32

    # Sprawdzenie zakończenia całego batcha tylko co N kamieni zamiast co ruch.
    # Martwe stoły są w międzyczasie maskowane i nie zmieniają stanu.
    sync_interval_moves: 8
