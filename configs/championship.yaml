# =============================================================================
# KING OF CONNECT6 — ALL MODELS RESIDENT GPU CHAMPIONSHIP — CNN
# =============================================================================

championship:

  checkpoint_dir: "runs/connect6_cnn_01/checkpoints"
  output_dir: "runs/connect6_cnn_01/championship"

  tables: 128

  games_per_pair: 2
  temperature: 0.0
  device: "cuda"
  amp: true
  amp_dtype: "bfloat16"

  cpu_cache_models: 16384
  empty_cache_after_unload: false
  seed: 12345

  adaptive_tables:
    enabled: true

    # Wszystkie checkpointy muszą siedzieć jednocześnie w lokalnym VRAM.
    # Nie ma już model-pool fallbacku.
    vram_limit_gb: 11.0
    vram_check_every_forwards: 32

    # Wartości bazowe używane przed autotuningiem.
    sync_interval_moves: 1
    refill_batch: 32

    # -------------------------------------------------------------------------
    # CNN BACKEND AUTOTUNE
    # -------------------------------------------------------------------------
    # Porównuje grouped-conv oraz im2col+BMM i BF16/FP16. Ten test pozostaje
    # krótki; zwycięski backend/dtype trafia potem do resident deep tunera.
    backend_autotune:
      enabled: true
      tables: [64, 96, 128, 160, 192, 256]
      model_block: 32
      refill: 24
      sync: 1
      amp_dtypes: ["bfloat16", "float16"]
      warmup_games: 128
      measure_games: 768
      max_seconds_per_test: 12.0

    # -------------------------------------------------------------------------
    # ALL-RESIDENT MODE — JEDYNA ŚCIEŻKA TURNIEJU
    # -------------------------------------------------------------------------
    all_resident:
      enabled: true

    # -------------------------------------------------------------------------
    # ALL-RESIDENT DEEP AUTOTUNE
    # -------------------------------------------------------------------------
    # Szeroki sweep liczby stołów. Testujemy przede wszystkim wielokrotności 32,
    # w tym dużo większe batche niż 128. Pomiar dla każdego T automatycznie
    # skaluje się do min. kilku pełnych fal gier, więc duże batche nie są oceniane
    # na zbyt krótkiej próbce.
    resident_autotune:
      table_candidates:
        [64, 96, 128, 160, 192, 224, 256, 320, 384, 448, 512,
         640, 768, 896, 1024, 1280, 1536, 1792, 2048]

      refill_candidates: [8, 16, 24, 32, 48, 64, 96, 128, 192, 256]
      sync_candidates: [1, 2, 4, 6, 8]

      warmup_games: 256
      measure_games: 2048
      minimum_measure_waves: 4
      validation_waves: 10

    progress_every_seconds: 5.0
    progress_every_matches: 500
    log_every_seconds: 1.0
