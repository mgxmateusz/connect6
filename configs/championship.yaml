# =============================================================================
# KING OF CONNECT6 — GLOBAL PERSISTENT GPU CHAMPIONSHIP — CNN
# =============================================================================

championship:

  checkpoint_dir: "runs/connect6_cnn_01/checkpoints"
  output_dir: "runs/connect6_cnn_01/championship"

  # Wartość awaryjna. Przy adaptive_tables.enabled=true liczba stołów jest
  # dobierana automatycznie po benchmarku GPU.
  tables: 128

  games_per_pair: 2
  temperature: 0.0
  device: "cuda"
  amp: true
  amp_dtype: "bfloat16"

  cpu_cache_models: 16384
  empty_cache_after_unload: false
  seed: 12345

  adaptive_tables:
    enabled: true

    # Twardy budżet lokalnego VRAM. Po przekroczeniu cache jest czyszczony,
    # a jeśli to nie pomaga, rozmiar stołów zostaje trwale oznaczony jako unsafe.
    vram_limit_gb: 11.0

    min_tables: 16
    max_tables: 2048
    candidates: [16, 32, 64, 128, 256, 512, 1024, 2048]

    # Autotuner mierzy 3 workloady: HOST-HOST, CROSS i pełny game-loop.
    # benchmark_model_pool odpowiada maksymalnej liczbie różnych modeli używanych
    # w syntetycznym teście; nie rośnie już automatycznie razem z tables.
    benchmark_iterations: 3
    benchmark_loop_moves: 8
    benchmark_model_pool: 128

    # CPU sprawdza zakończone sloty dopiero co N ruchów. Pomiędzy kontrolami
    # zakończone stoły są zamrożone maską.
    sync_interval_moves: 8
    vram_check_every_forwards: 32

    # Jeden globalny VectorConnect6 ma stale do `tables` slotów. Nowe gry są
    # dokładane dopiero po uzbieraniu co najmniej tej liczby wolnych miejsc,
    # chyba że wszystkie stoły są już puste.
    refill_batch: 32

    # Modele są ładowane do GPU pulami. Dwa różne bloki oznaczają maksymalnie
    # 2 * model_pool_block_size modeli w aktualnym ensemble.
    model_pool_block_size: 64

    # Następna pula checkpointów jest doczytywana do RAM w tle podczas pracy GPU.
    # Ranking/HTML oraz log konsoli są aktualizowane okresowo, nie po każdej grze.
    progress_every_seconds: 5.0
    progress_every_matches: 500
    log_every_seconds: 1.0
