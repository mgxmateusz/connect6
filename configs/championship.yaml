# =============================================================================
# KING OF CONNECT6 — FAST ALL-RESIDENT GPU CHAMPIONSHIP — CNN
# =============================================================================

championship:

  checkpoint_dir: "runs/connect6_cnn_01/checkpoints"
  output_dir: "runs/connect6_cnn_01/championship"

  tables: 128

  games_per_pair: 2
  temperature: 0.0
  device: "cuda"
  amp: true
  amp_dtype: "bfloat16"

  cpu_cache_models: 16384
  empty_cache_after_unload: false
  seed: 12345

  adaptive_tables:
    enabled: true

    # Wszystkie checkpointy siedzą jednocześnie w VRAM. Nie ma model pools.
    vram_limit_gb: 11.0
    vram_check_every_forwards: 32

    # Wartości bazowe przed autotuningiem.
    sync_interval_moves: 1
    refill_batch: 32

    # -------------------------------------------------------------------------
    # CNN BACKEND AUTOTUNE
    # -------------------------------------------------------------------------
    backend_autotune:
      enabled: true
      tables: [64, 96, 128, 160, 192, 256]
      model_block: 32
      refill: 24
      sync: 1
      amp_dtypes: ["bfloat16", "float16"]
      warmup_games: 128
      measure_games: 768
      max_seconds_per_test: 12.0

    # -------------------------------------------------------------------------
    # ALL-RESIDENT MODE — JEDYNA ŚCIEŻKA TURNIEJU
    # -------------------------------------------------------------------------
    all_resident:
      enabled: true

    # -------------------------------------------------------------------------
    # FAST ENGINE + FIXED-CORPUS AUTOTUNE
    # -------------------------------------------------------------------------
    # Każda konfiguracja tables/refill/sync rozgrywa dokładnie ten sam zamknięty
    # zestaw gier. Dzięki temu różna długość partii nie fałszuje benchmarku.
    resident_autotune:
      table_candidates:
        [64, 96, 128, 160, 192, 224, 256, 320, 384, 448, 512,
         640, 768, 896, 1024, 1280, 1536, 1792, 2048]

      refill_candidates: [8, 16, 24, 32, 48, 64, 96, 128, 192, 256]
      sync_candidates: [1, 2, 4, 6, 8]

      # Osobny identyczny warmup dla każdego testu, potem identyczny corpus.
      fixed_warmup_games: 2048
      fixed_measure_games: 4096
      fixed_validation_games: 12288

    progress_every_seconds: 5.0
    progress_every_matches: 500
    log_every_seconds: 1.0
