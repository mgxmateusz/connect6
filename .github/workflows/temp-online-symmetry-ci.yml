name: temp-online-symmetry-ci

on:
  push:
    branches:
      - feature/random-opening-online-symmetry

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/random-opening-online-symmetry
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded patch
        run: python tools/_apply_online_symmetry_patch.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q connect6 tests
      - name: Test
        run: python -m pytest -q
      - name: Commit tested implementation and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add connect6/train.py configs/train.yaml tests/test_training_features.py
          git rm tools/_apply_online_symmetry_patch.py .github/workflows/temp-online-symmetry-ci.yml
          git commit -m "Add random black openings and online D4 symmetry"
          git push origin HEAD:feature/random-opening-online-symmetry
