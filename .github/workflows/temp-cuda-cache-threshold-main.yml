name: temp-cuda-cache-threshold-main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install pytest torch --index-url https://download.pytorch.org/whl/cpu
      - name: Apply patch
        run: python tools/_apply_cuda_cache_threshold_main.py
      - name: Compile
        run: python -m compileall -q connect6 tests
      - name: Test
        run: python -m pytest -q
      - name: Commit tested patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add connect6/train.py tests/test_training_features.py configs/train.yaml
          git diff --cached --quiet && exit 0
          git commit -m "Clear CUDA cache when reserved VRAM reaches 10 GB [skip ci]"
          git push origin HEAD:main
